servo_node:
  ros__parameters:
    moveit_servo:
      use_gazebo: false
      status_topic: "~/status"

      # TOPICS
      cartesian_command_in_topic: "~/delta_twist_cmds"
      command_out_topic: "/right_control/joint_trajectory"
      joint_topic: "/joint_states"
      command_out_type: "trajectory_msgs/JointTrajectory"

      # KINEMATIC SETTINGS
      move_group_name: "right"
      planning_frame: "pelvis"
      robot_link_command_frame: "pelvis"
      ee_frame_name: "right_wrist_yaw_link"

      is_primary_planning_scene_monitor: true
      check_octomap_collisions: false
      publish_joint_positions: true
      publish_joint_velocities: true
      publish_joint_accelerations: false
      status_topic: ~/status

      # VELOCITY, SAFETY AND SCALE
      publish_period: 0.02
      incoming_command_timeout: 0.1
      command_in_type: "speed_units"
      scale:
        linear: 0.4
        rotational: 0.8
        joint: 0.5

      # SINGULARITIES AND BORDERS ---
      lower_singularity_threshold: 17.0
      hard_stop_singularity_threshold: 30.0
      joint_limit_margin: 0.1

      # COLLISION CHECKING
      check_collisions: true
      collision_check_rate: 10.0
      collision_check_type: "threshold_distance"
      self_collision_proximity_threshold: 0.01
      scene_collision_proximity_threshold: 0.02